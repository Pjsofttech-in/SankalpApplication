name: Deploy Sankalp Backend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Setup Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      # 3. Build Spring Boot application
      - name: Build application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 4. Find and prepare JAR
      - name: Prepare JAR
        run: |
          echo "Contents of target:"
          ls -lah target/

          JAR_FILE=$(find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No JAR file found!"
            exit 1
          fi

          echo "Found JAR: $JAR_FILE"

          cp "$JAR_FILE" sankalp-backend.jar

          echo "Prepared JAR:"
          ls -lh sankalp-backend.jar

      # 5. Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # 6. Upload JAR using normal SCP
      - name: Upload JAR to EC2
        run: |
          scp \
            -i ~/.ssh/ec2_key \
            sankalp-backend.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/

      # 7. Deploy on EC2
      - name: Deploy application
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            echo "======================================"
            echo "Starting Sankalp Backend Deployment"
            echo "======================================"

            echo "Checking uploaded JAR..."

            ls -lh /home/ec2-user/sankalp-backend.jar

            echo "Removing previous JAR..."

            sudo rm -f \
              /opt/sankalp-backend/sankalp-backend.jar

            echo "Moving new JAR..."

            sudo mv \
              /home/ec2-user/sankalp-backend.jar \
              /opt/sankalp-backend/sankalp-backend.jar

            echo "Setting ownership..."

            sudo chown ec2-user:ec2-user \
              /opt/sankalp-backend/sankalp-backend.jar

            echo "Reloading systemd..."

            sudo systemctl daemon-reload

            echo "Restarting Sankalp Backend..."

            sudo systemctl restart sankalp-backend

            echo "Waiting for application to start..."

            sleep 5

            echo "Checking service status..."

            sudo systemctl status sankalp-backend --no-pager

            echo "======================================"
            echo "Deployment completed successfully!"
            echo "======================================"

          EOF
